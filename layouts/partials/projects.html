<div class="project-grid">{{ range sort (where (where site.RegularPages "Section" "projects") "Params.featured" true) "Params.order" }}<article class="project-card reveal"><a class="project-art" style="view-transition-name: project-{{ .Params.key }}" href="{{ .RelPermalink }}"><span class="project-number">0{{ .Params.order }} / MAIRL</span><img src="/art/{{ if in (slice "owm" "aior") .Params.key }}world{{ else }}landscape{{ end }}.svg" alt="" loading="lazy"><span class="project-art-label">{{ .Params.category_en }}</span></a><div class="project-copy"><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p class="project-description">{{ .Params.description }}</p><div class="project-focus">{{ range .Params.flow }}<span>{{ .title }}</span>{{ end }}</div><a class="project-detail-link" href="{{ .RelPermalink }}">探索研究 <span>↗</span></a></div></article>{{ end }}</div>
