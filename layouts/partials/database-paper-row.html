<article class="paper-row" id="{{ .id }}"><div class="paper-venue"><strong>{{ .venue }}</strong></div><div class="paper-main"><h3><a href="/publications/#{{ .id }}">{{ .title }}</a></h3><p class="paper-authors">{{ range $i,$author := .author_entries }}{{ if $i }}<span class="author-separator">, </span>{{ end }}<a href="{{ .url }}">{{ .label }}</a>{{ end }}</p><div class="paper-actions">{{ range .links.pdf }}<a href="{{ . }}" target="_blank" rel="noopener">PDF</a>{{ end }}{{ range .links.code }}<a href="{{ . }}" target="_blank" rel="noopener">代码/资料</a>{{ end }}{{ range .links.posts }}<a href="{{ . }}" target="_blank" rel="noopener">推文解读</a>{{ end }}<button class="small-btn" data-copy-cite="{{ .authors }}. {{ .title }}. {{ .venue_full }}">复制引用</button></div></div></article>
